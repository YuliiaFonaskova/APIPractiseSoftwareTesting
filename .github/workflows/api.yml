name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check .

  api-tests:
    needs: lint
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://restful-booker.herokuapp.com
      API_USERNAME: ${{ secrets.API_USERNAME || 'admin' }}
      API_PASSWORD: ${{ secrets.API_PASSWORD || 'password123' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mochawesome-report
          path: mochawesome-report/
          retention-days: 30
